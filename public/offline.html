<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#123c2f" />
    <title>bilim · 오프라인 · Offline · 离线</title>
    <style>
      :root {
        --forest: #123c2f;
        --ink: #1e2a25;
        --ink-soft: #4a5a52;
        --mist: #f5f7f4;
        --line: #d5ddd2;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--mist);
        color: var(--ink);
        font-family:
          "Pretendard Variable", Pretendard, "Noto Sans KR", "Noto Sans SC",
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        margin: 16px 0 4px;
        font-size: 20px;
      }
      p {
        margin: 4px 0;
        color: var(--ink-soft);
        line-height: 1.6;
      }
      .block {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }
      button {
        margin-top: 24px;
        min-height: 48px;
        width: 100%;
        border: 0;
        border-radius: 999px;
        background: var(--forest);
        color: #fff;
        font: inherit;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--forest);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="bilim" />
      <div lang="ko">
        <h1>인터넷에 연결되어 있지 않아요</h1>
        <p>연결을 확인한 뒤 다시 시도해 주세요.</p>
      </div>
      <div lang="en" class="block">
        <h1>You're offline</h1>
        <p>Check your connection and try again.</p>
      </div>
      <div lang="zh-CN" class="block">
        <h1>当前没有网络连接</h1>
        <p>请检查网络后重试。</p>
      </div>
      <button type="button" onclick="location.reload()">
        다시 시도 · Try again · 重试
      </button>
    </main>
  </body>
</html>
